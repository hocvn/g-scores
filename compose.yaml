
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter @app/web dev --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/backend/node_modules
    depends_on:
      - backend
    environment:
      API_PROXY_TARGET: http://api:3000

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm --filter backend dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/backend/node_modules
    environment:
      NODE_ENV: development
      PORT: "3000"
